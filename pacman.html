<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
html, body { overflow:hidden; height:100%; }

body {
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* Title */
h1 { margin:20px 0 10px; font-size:1.8rem; letter-spacing:1px; text-shadow:0 0 10px #00ffe5; }

/* Level Buttons */
#levelButtons {
  display:flex; justify-content:center; gap:15px; margin-bottom:10px;
}
.level-btn {
  padding:5px 15px; border-radius:10px;
  background:rgba(0,255,229,0.3); color:#111; font-weight:bold;
  box-shadow:0 4px 10px rgba(0,255,229,0.5);
  transition:0.1s; cursor:pointer;
}
.level-btn.selected {
  background: #00ffe5;
  color:#111;
  box-shadow:0 4px 15px rgba(0,255,229,0.8);
}
.level-btn:active { transform:scale(0.95); }

/* Scoreboard */
#scoreboard {
  font-size:1.3rem; color:#00ffe5; text-shadow:0 0 5px #00ffe5;
  margin-bottom:10px;
}

/* Game Container */
#gameContainer {
  position:relative; width:90vw; max-width:400px; height:65vh; /* taller container */
  background:#111; border-radius:20px; overflow:hidden; 
  box-shadow:0 0 30px #00ffe5;
  margin-bottom:20px;
}
canvas { width:100%; height:100%; display:block; }

/* Game Over Overlay */
#gameOver {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;
  font-size:2rem; color:#ff2e63; flex-direction:column; display:none;
}
#gameOver span { font-size:1rem; margin-top:10px; color:#00ffe5; }

/* Arrow Controls (D-pad) BELOW container */
#controls {
  width:200px; height:200px;
  display:grid;
  grid-template-columns:60px 60px 60px;
  grid-template-rows:60px 60px 60px;
  gap:10px;
  touch-action:none;
  margin-top:20px; /* space below game container */
}
.btn {
  width:60px; height:60px; border-radius:15px;
  background:rgba(0,255,229,0.4); display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; color:#111; font-weight:bold;
  box-shadow: 0 4px 10px rgba(0,255,229,0.5);
  user-select:none;
  transition: 0.1s;
}
.btn:active {
  transform: scale(0.9);
  background:rgba(0,255,229,0.7);
}
.invisible { visibility:hidden; }

/* Mobile adjustments */
@media(max-width: 500px){
  #controls { 
    width:180px; height:180px; 
    grid-template-columns:50px 50px 50px; 
    grid-template-rows:50px 50px 50px; 
    gap:8px; 
  }
  .btn { width:50px; height:50px; font-size:1.3rem; border-radius:12px; }
  #gameContainer { height:60vh; } /* slightly smaller on mobile */
}
</style>
</head>
<body>

<h1>Snake Game</h1>

<!-- Level Buttons -->
<div id="levelButtons">
  <div class="level-btn selected" data-speed="20">Easy</div>
  <div class="level-btn" data-speed="12">Medium</div>
  <div class="level-btn" data-speed="8">Hard</div>
</div>

<div id="scoreboard">Score: 0 | High Score: 0</div>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="gameOver">GAME OVER<span>Tap anywhere to restart</span></div>
</div>

<!-- Arrow buttons (D-pad) BELOW the container -->
<div id="controls">
  <div class="invisible"></div>
  <div class="btn" data-dir="up">↑</div>
  <div class="invisible"></div>
  <div class="btn" data-dir="left">←</div>
  <div class="btn" data-dir="down">↓</div>
  <div class="btn" data-dir="right">→</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');
canvas.width = container.clientWidth;
canvas.height = container.clientHeight;

const gridSize = 20;
const tileCountX = Math.floor(canvas.width / gridSize);
const tileCountY = Math.floor(canvas.height / gridSize);

let snake = [{x:5,y:5}];
let velocity = {x:1,y:0};
let food = spawnFood();
let score = 0;
let highScore = 0;
let speed = 20; // default Easy
let gameOver = false;
let count = 0;

// Level buttons
const levels = document.querySelectorAll('.level-btn');
levels.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    levels.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    speed = parseInt(btn.dataset.speed);
  });
});

// Arrow Buttons
document.querySelectorAll('#controls .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    switch(dir){
      case 'up': if(velocity.y===0){velocity={x:0,y:-1};} break;
      case 'down': if(velocity.y===0){velocity={x:0,y:1};} break;
      case 'left': if(velocity.x===0){velocity={x:-1,y:0};} break;
      case 'right': if(velocity.x===0){velocity={x:1,y:0};} break;
    }
  });
});

// Tap to restart
container.addEventListener('click', () => {
  if(gameOver){ resetGame(); }
});

function spawnFood(){
  return {x:Math.floor(Math.random()*tileCountX), y:Math.floor(Math.random()*tileCountY)};
}

function resetGame(){
  snake = [{x:5,y:5}];
  velocity = {x:1,y:0};
  score = 0;
  food = spawnFood();
  gameOver=false;
  document.getElementById('gameOver').style.display='none';
  document.getElementById('scoreboard').innerText = `Score: ${score} | High Score: ${highScore}`;
}

function gameLoop(){
  requestAnimationFrame(gameLoop);
  if(++count<speed) return;
  count=0;
  if(!gameOver) { update(); draw(); }
}

function update(){
  const head = {x:snake[0].x + velocity.x, y:snake[0].y + velocity.y};

  if(head.x<0) head.x=tileCountX-1;
  if(head.x>=tileCountX) head.x=0;
  if(head.y<0) head.y=tileCountY-1;
  if(head.y>=tileCountY) head.y=0;

  if(snake.some(seg => seg.x===head.x && seg.y===head.y)){
    gameOver=true;
    if(score>highScore) highScore=score;
    document.getElementById('gameOver').style.display='flex';
    return;
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    food = spawnFood();
  } else {
    snake.pop();
  }

  document.getElementById('scoreboard').innerText = `Score: ${score} | High Score: ${highScore}`;
}

function draw(){
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle='#ff2e63';
  ctx.beginPath();
  ctx.arc(food.x*gridSize + gridSize/2, food.y*gridSize + gridSize/2, gridSize/2-2, 0, Math.PI*2);
  ctx.fill();

  snake.forEach((seg,index)=>{
    if(index===0){
      ctx.fillStyle='#00ffe5';
      ctx.strokeStyle='#00b3b3';
      ctx.lineWidth=2;
    } else {
      ctx.fillStyle='#00a3c4';
      ctx.strokeStyle='#007a8c';
      ctx.lineWidth=1;
    }
    ctx.fillRect(seg.x*gridSize, seg.y*gridSize, gridSize-2, gridSize-2);
    ctx.strokeRect(seg.x*gridSize, seg.y*gridSize, gridSize-2, gridSize-2);
  });
}

gameLoop();
</script>

</body>
</html>
